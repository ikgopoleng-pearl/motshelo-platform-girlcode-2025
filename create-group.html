<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Motshelo Group | BothoTech</title>
<link rel="stylesheet" href="css/create-group.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<header class="header">
  <div class="logo"><i data-lucide="gem"></i> BothoTech</div>
  <nav class="nav-links">
    <a href="dashboard.html" class="nav-link">Dashboard</a>
    <a href="groups.html" class="nav-link active">Groups</a>
    <a href="notifications.html" class="nav-link">Notifications</a>
    <a href="profile.html" class="nav-link">Profile</a>
  </nav>
  <div class="profile-badge">M</div>
</header>

<main class="container">
  <section class="form-section">
    <h1>Create a New Motshelo Group</h1>
    <p class="subtitle">Define your group’s saving structure and member limits clearly.</p>

    <form id="create-group-form" class="group-form">
      <div class="form-group">
        <label for="groupName">Group Name</label>
        <input type="text" id="groupName" name="groupName" placeholder="e.g. Bophelo Savings Circle" required>
      </div>

      <div class="form-group">
        <label for="description">Group Description</label>
        <textarea id="description" name="description" placeholder="Describe your group’s purpose, goals, or savings rules..." rows="4" required></textarea>
      </div>

      <div class="form-group">
        <label for="monthlyAmount">Contribution Amount (R)</label>
        <input type="number" id="monthlyAmount" name="monthlyAmount" placeholder="e.g. 500" required>
      </div>

      <div class="form-group">
        <label for="frequency">Contribution Frequency</label>
        <select id="frequency" name="frequency" required>
          <option value="">-- Select Frequency --</option>
          <option value="weekly">Weekly</option>
          <option value="biweekly">Bi-weekly</option>
          <option value="monthly">Monthly</option>
          <option value="quarterly">Quarterly</option>
        </select>
      </div>

      <div class="form-group">
        <label for="payoutCycle">Payout Cycle</label>
        <select id="payoutCycle" name="payoutCycle" required>
          <option value="">-- Select Cycle --</option>
          <option value="rotation">Rotation (Each member takes turns)</option>
          <option value="monthly">Monthly fixed payout</option>
          <option value="custom">Custom schedule</option>
        </select>
      </div>

      <div class="form-group">
        <label for="maxMembers">Maximum Number of Members</label>
        <input type="number" id="maxMembers" name="maxMembers" placeholder="e.g. 10" min="2" required>
      </div>

      <div class="form-group">
        <label for="startDate">Start Date</label>
        <input type="date" id="startDate" name="startDate" required>
      </div>

      <div class="form-actions">
        <button type="submit" class="create-btn"><i data-lucide="plus-circle"></i> Create Group</button>
        <button type="reset" class="cancel-btn"><i data-lucide="x-circle"></i> Cancel</button>
      </div>
    </form>
  </section>
</main>

<script src="js/create-group.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{ if(typeof lucide!=='undefined'){ lucide.createIcons(); } });
</script>

</body>
</html>
